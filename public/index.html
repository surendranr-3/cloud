<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinanceFlow | Expense Tracker</title>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, 'Segoe UI', sans-serif; }

    body {
      background: linear-gradient(145deg, #e9f0fc, #d9e4f5);
      min-height: 100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .app {
      width:100%;
      max-width:700px;
      background:white;
      border-radius:20px;
      box-shadow:0 20px 40px rgba(0,0,0,0.2);
      overflow:hidden;
    }

    .header {
      background:#1e293b;
      color:white;
      padding:20px;
      text-align:center;
    }

    .header h1 span {
      background:#facc15;
      color:black;
      padding:5px 10px;
      border-radius:20px;
    }

    .content { padding:20px; }

    .balance {
      background:#1e293b;
      color:white;
      padding:20px;
      border-radius:15px;
      text-align:center;
      margin-bottom:20px;
    }

    .balance h2 {
      color:#facc15;
      font-size:2.5rem;
    }

    .stats {
      display:flex;
      gap:10px;
      margin-bottom:20px;
    }

    .card {
      flex:1;
      padding:15px;
      border-radius:10px;
      text-align:center;
      background:#f8fafc;
    }

    .income { color:#10b981; font-weight:bold; }
    .expense { color:#ef4444; font-weight:bold; }

    .form input {
      width:100%;
      padding:10px;
      margin-bottom:10px;
      border-radius:10px;
      border:1px solid #ccc;
    }

    .form button {
      width:100%;
      padding:10px;
      border:none;
      border-radius:10px;
      background:#1e293b;
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    .reset {
      margin-top:10px;
      background:#eee;
      color:black;
    }

    ul {
      list-style:none;
      margin-top:15px;
      max-height:300px;
      overflow:auto;
    }

    li {
      background:#f8fafc;
      padding:10px;
      border-radius:10px;
      margin-bottom:10px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .delete {
      cursor:pointer;
      color:red;
      border:none;
      background:none;
    }

    .error {
      color:red;
      text-align:center;
      margin-top:10px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>💰 FinanceFlow <span>Tracker</span></h1>
  </div>

  <div class="content">

    <div class="balance">
      <p>Your Balance</p>
      <h2 id="balance">$0</h2>
    </div>

    <div class="stats">
      <div class="card">
        <p>Income</p>
        <p id="income" class="income">$0</p>
      </div>
      <div class="card">
        <p>Expense</p>
        <p id="expense" class="expense">$0</p>
      </div>
    </div>

    <div class="form">
      <input id="text" placeholder="Description">
      <input id="amount" type="number" placeholder="Amount">

      <label><input type="radio" name="type" value="income" checked> Income</label>
      <label><input type="radio" name="type" value="expense"> Expense</label>

      <button onclick="addTransaction()">Add</button>
      <button class="reset" onclick="resetAll()">Reset All</button>

      <div class="error" id="error"></div>
    </div>

    <ul id="list"></ul>

  </div>
</div>

<script>

const API = "/api/transactions";
let data = [];

function showError(msg){
  document.getElementById("error").innerText = msg;
  setTimeout(()=>document.getElementById("error").innerText="",2000);
}

async function load(){
  try{
    const res = await fetch(API);
    data = await res.json();
    updateUI();
  }catch{
    showError("Server error");
  }
}

function updateUI(){
  let income=0, expense=0;

  data.forEach(t=>{
    if(t.amount>0) income+=t.amount;
    else expense+=Math.abs(t.amount);
  });

  document.getElementById("income").innerText = "$"+income.toFixed(2);
  document.getElementById("expense").innerText = "$"+expense.toFixed(2);
  document.getElementById("balance").innerText = "$"+(income-expense).toFixed(2);

  const list = document.getElementById("list");
  list.innerHTML="";

  data.slice().reverse().forEach(t=>{
    const li=document.createElement("li");
    li.innerHTML = `
      ${t.text} 
      <span>${t.amount>0?"+":""}$${Math.abs(t.amount)}</span>
      <button class="delete" onclick="remove(${t.id})">❌</button>
    `;
    list.appendChild(li);
  });
}

async function addTransaction(){
  const text = document.getElementById("text").value.trim();
  let amount = parseFloat(document.getElementById("amount").value);

  if(!text) return showError("Enter description");
  if(isNaN(amount) || amount<=0) return showError("Invalid amount");

  const type = document.querySelector("input[name='type']:checked").value;
  if(type==="expense") amount = -amount;

  const res = await fetch(API,{
    method:"POST",
    headers:{ "Content-Type":"application/json"},
    body: JSON.stringify({text, amount})
  });

  const newT = await res.json();
  data.push(newT);
  updateUI();

  document.getElementById("text").value="";
  document.getElementById("amount").value="";
}

async function remove(id){
  await fetch(API+"/"+id,{method:"DELETE"});
  data = data.filter(t=>t.id!==id);
  updateUI();
}

async function resetAll(){
  if(!confirm("Delete all transactions?")) return;

  await fetch(API,{method:"DELETE"});
  data=[];
  updateUI();
}

load();

</script>

</body>
</html>
